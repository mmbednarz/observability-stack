# Prometheus - storage metryk. Dane przychodzą przez remote write z Alloy (oraz z metrics-generatora Tempo).
# Plik generowany przez Install-ObservabilityStack.ps1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: "{{ENVIRONMENT}}"

# Brak własnych scrape_configs - wszystkie scrape'y realizuje Alloy.
scrape_configs: []
