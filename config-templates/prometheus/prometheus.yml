# Prometheus - metrics storage. Data arrives via remote write from Alloy (and from the Tempo metrics-generator).
# File generated by Install-ObservabilityStack.ps1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: "{{ENVIRONMENT}}"

# No scrape_configs of its own - Alloy performs all scrapes.
scrape_configs: []
