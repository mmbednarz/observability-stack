# Grafana Tempo 2.10.x - monolithic mode, local storage.
# File generated by Install-ObservabilityStack.ps1.
stream_over_http_enabled: true

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9097
  log_level: info

# Memberlist on a non-standard port (7946 is often taken), localhost only
memberlist:
  bind_addr: ["127.0.0.1"]
  bind_port: 7947
  join_members: []

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:14317

ingester:
  max_block_duration: 5m

# TraceQL metrics ("Where the time goes" tables, 7-day rankings in "WEBCON – Operations") - the default range limit is 3 h.
# 169h instead of 168h: the range start is aligned down to the step, so "last 7 days" exceeds 168h.
query_frontend:
  metrics:
    max_duration: 169h

compactor:
  compaction:
    block_retention: {{RETENTION_TRACES}}

metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: "{{ENVIRONMENT}}"
  storage:
    path: {{DATA_FWD}}/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: {{DATA_FWD}}/tempo/generator/traces
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      # service.name, span.name, span.kind, status.code are default dimensions.
      # Actions and paths (7-day rankings in "WEBCON – Operations"): the attributes exist only on action / transition spans,
      # so other series do not multiply (~28 series per used action / path: 2 services × 14). On "workflow.execute"
      # Alloy renames webcon.path.id to webcon.workflow.path.id (otherwise 2× more series per path).
      # Business rules and data sources - TraceQL metrics.
      dimensions: ["webcon.db.id", "webcon.service.role.name", "webcon.action.id", "webcon.action.name", "webcon.path.id"]
      # Buckets chosen to match dashboard thresholds (p95 1/3 s, transitions 2/5 s) – 9 instead of the default 14 (powers of 2 from 2 ms),
      # 14 instead of 19 series per label combination (calls, size, count, sum, 10 × bucket). No distinction below 10 ms.
      histogram_buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 15]
    local_blocks:
      filter_server_spans: false
      # Generator blocks (replicationFactor 1) in storage - TraceQL metrics queries over historical data run on them
      # (7-day rankings). Do not disable despite the index incident (2026-11-03) - Test-ObservabilityStack.ps1 detects the corruption.
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: {{DATA_FWD}}/tempo/wal
    local:
      path: {{DATA_FWD}}/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
      # Cardinality safeguard: once exceeded, the generator creates no new series (existing ones are still updated)
      max_active_series: 200000

usage_report:
  reporting_enabled: false
