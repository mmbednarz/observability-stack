# Data sources with correlation: metrics (exemplars) -> traces -> logs.
# File generated by Install-ObservabilityStack.ps1. In provisioning, the $ character is written as $$.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
        # Grafana 12.4 + Tempo 2.10: instant quantile_over_time via streaming returns an empty result
        # (TraceQL tables in the WEBCON – Performance dashboard); works without streaming
        metrics: false
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      # Trace by ID without a time range: links from exemplars (and from logs) open Explore with "now-1h" instead of the
      # exemplar time - with the shift enabled, Tempo returned an empty trace for traces older than ~1 h ("trace not found").
      # Trace by ID over the whole retention takes ~0.1-0.2 s.
      traceQuery:
        timeShiftEnabled: false
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
          - name: Latency p95
            query: histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        # OTLP (Portal) and Service (regex in Alloy) - trace_id in structured metadata
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace
        # Fallback - TraceId in the log line body (no inline (?i): the regex runs in the browser, JavaScript has no inline flags)
        - name: TraceId (body)
          matcherType: regex
          matcherRegex: "[Tt][Rr][Aa][Cc][Ee]_?[Ii][Dd][\"'=: ]+([0-9a-fA-F]{32})"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace

# @@BEGIN WEBCONSQL
  # WEBCON content database - current state (active tasks, path names) for the WEBCON – Operations dashboard.
  # Read-only login with SELECT on 5 tables (sql/grant-webcon-reader-permissions.sql), not the exporter login.
  - name: WEBCON SQL
    uid: webcon-sql
    type: mssql
    access: proxy
    url: "{{WEBCONSQL_URL}}"
    user: "{{WEBCONSQL_LOGIN}}"
    editable: false
    jsonData:
      database: "{{WEBCONSQL_DATABASE}}"
      encrypt: "{{WEBCONSQL_ENCRYPT}}"
      tlsSkipVerify: {{WEBCONSQL_TLS_SKIP_VERIFY}}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $__file{{{SECRETS_FWD}}/grafana-sql-reader.txt}
# @@END WEBCONSQL
