# Observability stack alert rules (design: docs/projekt/projekt-alerty.md).
# File generated by Install-ObservabilityStack.ps1. Provisioned rules are read-only in the Grafana UI.
# Prometheus / Loki outage = query error in every rule (execErrState: Error -> DatasourceError alert).
apiVersion: 1
groups:
  - orgId: 1
    name: Stack
    folder: Observability stack – alerts
    interval: 1m
    rules:
      - uid: stack-o1-component-down
        title: O1 Stack component not responding
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job=~"observability/.*"}
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) is not responding"
          description: Prometheus has been unable to scrape the component for 5 min. Check the obs-* service (Get-Service obs-*) and the logs in {{LOGS_DIR}}.

      - uid: stack-o2-host-silent
        title: O2 Host stopped sending metrics
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # hosts seen within 24 h with no metrics for 10 min (stack, remote agents)
              expr: |-
                max by (instance) (last_over_time(windows_os_info[24h]))
                unless on(instance) max by (instance) (last_over_time(windows_os_info[10m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: no host metrics for over 10 min"
          description: The host sent metrics within the last 24 h. On the stack VM this usually means obs-alloy is stopped (O1 stays silent then - Alloy collects up). On an agent host, check the obs-alloy service (Application event log, source Alloy) and connectivity to port 9999 on the stack. The alert clears by itself 24 h after the host is shut down.
          __dashboardUid__: windows-host
          __panelId__: "2"

      - uid: stack-o3-webcon-silent
        title: O3 No telemetry from WEBCON WorkFlow Service
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Service only - the Portal under IIS may be stopped by the application pool idle timeout
              expr: |-
                max by (job) (last_over_time(target_info{job="WebCon.WorkFlow"}[24h]))
                unless on(job) max by (job) (last_over_time(target_info{job="WebCon.WorkFlow"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: WEBCON WorkFlow Service has sent no telemetry for over 15 min
          description: No OTLP metrics from the Service (present within 24 h). Check the “WebCon WorkFlow Service” service, the OpenTelemetry section in appsettings, and Alloy (local or the agent on the WEBCON host).

      - uid: stack-o4-tempo-errors
        title: O4 Tempo - query errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (route) (increase(tempo_request_duration_seconds_count{status_code=~"5..",route!="ready"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Tempo {{ $labels.route }}: {{ humanize $values.B.Value }} 5xx responses in 15 min"
          description: Tempo query errors. “reading parquet file metadata” = corrupted block index - repair procedure in the README (delete index.json.gz and index.pb.zst). Run Test-ObservabilityStack.ps1.

      - uid: stack-o5-tempo-series-near-limit
        title: O5 Tempo - spanmetrics near series limit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(tempo_metrics_generator_registry_active_series / on(instance, tenant) tempo_metrics_generator_registry_max_active_series)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0.8] } } ] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Tempo metrics-generator: {{ humanizePercentage $values.B.Value }} of the max_active_series limit"
          description: The number of spanmetrics series is approaching max_active_series (tempo.yaml). Once exceeded, new series are dropped (alert O5b).

      - uid: stack-o5b-tempo-series-limited
        title: O5b Tempo - spanmetrics dropping series
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(tempo_metrics_generator_registry_series_limited_total[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "Tempo metrics-generator dropped {{ humanize $values.B.Value }} series in 15 min"
          description: max_active_series exceeded - dashboards based on traces_spanmetrics_* have incomplete data.

      - uid: stack-o6-alloy-dropped
        title: O6 Alloy - telemetry dropped or not sent
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # errors must last 10 min (for) - a single backend restart during installation does not fire
              # each metric separately: increase({__name__=~...}) drops the metric name and series with the same
              # labels collide (error "vector cannot contain metrics with the same labelset")
              expr: |-
                (sum(increase(otelcol_receiver_refused_spans_total[5m])) or vector(0))
                + (sum(increase(otelcol_receiver_refused_log_records_total[5m])) or vector(0))
                + (sum(increase(otelcol_receiver_refused_metric_points_total[5m])) or vector(0))
                + (sum(increase(otelcol_exporter_send_failed_spans_total[5m])) or vector(0))
                + (sum(increase(otelcol_exporter_send_failed_log_records_total[5m])) or vector(0))
                + (sum(increase(otelcol_exporter_send_failed_metric_points_total[5m])) or vector(0))
                + (sum(increase(prometheus_remote_storage_samples_failed_total[5m])) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Alloy: {{ humanize $values.B.Value }} records dropped / not sent in 5 min"
          description: For 10 min Alloy has been dropping telemetry (memory_limiter) or failing to send it to Tempo / Loki / Prometheus. Details - Alloy UI http://127.0.0.1:12345 and the Application event log (source Alloy).

      - uid: stack-o7-data-disk
        title: O7 Low disk space for stack data
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min(100 * windows_logical_disk_free_bytes{instance=~"(?i){{STACK_HOST}}([.].*)?",volume="{{DATA_VOLUME}}"} / windows_logical_disk_size_bytes{instance=~"(?i){{STACK_HOST}}([.].*)?",volume="{{DATA_VOLUME}}"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [15] } } ] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "{{DATA_VOLUME}} (stack data): {{ humanize $values.B.Value }}% free (threshold 15%)"
          description: Less than 15% free space is left on the volume holding {{DATA_DIR}}. Reduce retention (-RetentionTracesDays / -RetentionLogsDays) or extend the disk.
          __dashboardUid__: windows-host
          __panelId__: "21"
