        annotations:
          summary: "{{ $labels.instance }} {{ $labels.volume }}: {{ humanize $values.B.Value }}% free (threshold 5%)"
          description: Less than 5% free space on the volume - risk of SQL Server / WEBCON / stack stopping.
          __dashboardUid__: windows-host
          __panelId__: "21"
