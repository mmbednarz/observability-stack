# WEBCON, SQL Server and host alert rules (design: docs/projekt/projekt-alerty.md).
# File generated by Install-ObservabilityStack.ps1. Provisioned rules are read-only in the Grafana UI.
#
# Convention: query A (instant) returns the measured value, volume conditions are in PromQL (and on() ...),
# B = reduce (last) - only expressions are available in template $values, the threshold is evaluated by expression C (threshold). No data = OK (a machine without WEBCON / SQL does not fire).
apiVersion: 1
groups:
  # -------------------------------------------------------------------
  - orgId: 1
    name: WEBCON
    folder: WEBCON – alerts
    interval: 1m
    rules:
      - uid: webcon-w1-transitions-p95
        title: W1 Slow path transitions (p95)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                histogram_quantile(0.95, sum by (le) (rate(webcon_elements_management_path_transitions_times_milliseconds_bucket[10m])))
                and on() sum(increase(webcon_elements_management_path_transitions_times_milliseconds_count[10m])) >= 10
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [5000] } } ] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Path transitions p95 {{ humanize $values.B.Value }} ms (threshold 5000 ms)"
          description: Path transitions (Portal and Service) slower than 5 s at p95 for 10 min, with at least 10 transitions. Path and rule ranking - WEBCON – Performance dashboard, “Forms and path transitions” / “Where the time goes” rows.
          __dashboardUid__: webcon-performance
          __panelId__: "26"

      - uid: webcon-w2-portal-p95
        title: W2 Slow Portal (p95)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="Portal",http_route!~"/?health.*"}[10m])))
                and on() sum(increase(http_server_request_duration_seconds_count{job="Portal",http_route!~"/?health.*"}[10m])) >= 50
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [3] } } ] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Portal requests p95 {{ humanize $values.B.Value }} s (threshold 3 s)"
          description: Portal requests (excluding health check) slower than 3 s at p95 for 10 min, with at least 50 requests. Slowest routes - WEBCON – Performance dashboard, “Portal – user experience” row.
          __dashboardUid__: webcon-performance
          __panelId__: "16"

      - uid: webcon-w3-portal-5xx
        title: W3 Portal 5xx errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                100 * sum(increase(http_server_request_duration_seconds_count{job="Portal",http_route!~"/?health.*",http_response_status_code=~"5.."}[10m]))
                  / sum(increase(http_server_request_duration_seconds_count{job="Portal",http_route!~"/?health.*"}[10m]))
                and on() sum(increase(http_server_request_duration_seconds_count{job="Portal",http_route!~"/?health.*",http_response_status_code=~"5.."}[10m])) >= 10
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [5] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ humanize $values.B.Value }}% of Portal requests end with a 5xx error (threshold 5%)"
          description: At least 10 5xx errors in 10 min and over 5% of requests. Routes and codes - WEBCON – Performance dashboard, “Portal – user experience” row; details in the Portal logs (Loki).
          __dashboardUid__: webcon-performance
          __panelId__: "18"

      - uid: webcon-w4-service-heartbeat
        title: W4 No Service heartbeat
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 1 = the Service sent a heartbeat within 24 h, but not in the last 10 min
              expr: |-
                (vector(1) and on() sum(increase(traces_spanmetrics_calls_total{service="WebCon.WorkFlow",span_name="webcon.service.heartbeat"}[24h])) > 0)
                unless on() sum(increase(traces_spanmetrics_calls_total{service="WebCon.WorkFlow",span_name="webcon.service.heartbeat"}[10m])) > 0
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: WEBCON WorkFlow Service has sent no heartbeat for over 10 min
          description: No webcon.service.heartbeat spans (present within the last 24 h). Check the “WebCon WorkFlow Service” service and the event log; if other telemetry is missing too - alert O3.
          __dashboardUid__: webcon-performance
          __panelId__: "56"

      - uid: webcon-w5-heartbeat-errors
        title: W5 Heartbeat / health check errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                sum by (span_name) (increase(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR",span_name=~"webcon\\.(service|portal)\\.heartbeat|webcon\\.service\\.health\\.check"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.span_name }}: {{ humanize $values.B.Value }} errors in 10 min"
          description: Heartbeat / health check spans ended with an error. Traces - Explore (Tempo) { status = error && name = "{{ $labels.span_name }}" }.
          __dashboardUid__: webcon-performance
          __panelId__: "56"

      - uid: webcon-w6-queue-errors
        title: W6 Service queue errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Service roles: 25 UserSynchronization, 40-42 Solr queues
              expr: |-
                sum by (role) (
                  label_replace(label_replace(label_replace(label_replace(label_replace(
                    increase(webcon_service_queue_item_error_total[15m]),
                    "role", "role $1", "webcon_service_role_id", "(.*)"),
                    "role", "UserSynchronization", "webcon_service_role_id", "25"),
                    "role", "SolrActivityQueue", "webcon_service_role_id", "40"),
                    "role", "SolrElementQueue", "webcon_service_role_id", "41"),
                    "role", "SolrFileQueue", "webcon_service_role_id", "42"))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Service queue ({{ $labels.role }}): {{ humanize $values.B.Value }} errors in 15 min"
          description: Service queue items ended with an error. Details in the Service logs (service_name="WebCon.WorkFlow", level error).
          __dashboardUid__: webcon-performance
          __panelId__: "49"

      - uid: webcon-w7-solr-backlog
        title: W7 Growing Solr indexing backlog
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # added - processed in 30 min (elements, attachments, activities, utilities)
              # each metric separately: increase({__name__=~...}) drops the metric name and series with the same
              # labels collide (error "vector cannot contain metrics with the same labelset")
              expr: |-
                ((sum(increase(webcon_solr_queue_elements_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_attachments_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_activities_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_utilities_total[30m])) or vector(0)))
                - ((sum(increase(webcon_solr_queue_elements_processed_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_attachments_processed_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_activities_processed_total[30m])) or vector(0))
                  + (sum(increase(webcon_solr_queue_utilities_processed_total[30m])) or vector(0)))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [1000] } } ] }
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Solr queue growing: +{{ humanize $values.B.Value }} in 30 min"
          description: More items enter the Solr indexing queues than the Service processes (over 1000 in 30 min, sustained for 30 min). Check Solr and Service roles 40-42.
          __dashboardUid__: webcon-performance
          __panelId__: "52"

      - uid: webcon-w8-datasource-errors
        title: W8 Data source errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              # the Portal logs 2 records per error - the RequestLoggingMiddleware record is skipped
              expr: |-
                sum by (data_source, data_source_id) (count_over_time({service_name=~"Portal|WebCon.WorkFlow"} | exception_message=~"(?s)Error getting data for DataSource.*" | scope_name!="Serilog.AspNetCore.RequestLoggingMiddleware" | line_format "{{.exception_message}}" | regexp "DataSource name: (?P<data_source>.*?) ID: (?P<data_source_id>[0-9]+)" [15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [4] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Data source {{ $labels.data_source }} (ID {{ $labels.data_source_id }}): {{ humanize $values.B.Value }} errors in 15 min"
          description: At least 5 data retrieval errors from the data source in 15 min. Details - WEBCON – Operations dashboard, data source errors panel.
          __dashboardUid__: webcon-operations
          __panelId__: "31"

      - uid: webcon-w9-http-client-errors
        title: W9 External API call errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # excluding internal WEBCON calls (localhost, own host name and IP addresses: Solr, Service modules, Portal -> Service), Solr (8983) and OTLP
              expr: |-
                sum by (server_address, server_port) (increase(http_client_request_duration_seconds_count{job=~"Portal|WebCon.WorkFlow",error_type!="",server_port!~"4317|4318|8983",server_address!~"(?i)(localhost|127[.]0[.]0[.]1|{{WEBCON_SELF_HOSTS}})([.].*)?"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [9] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.server_address }}:{{ $labels.server_port }}: {{ humanize $values.B.Value }} errors in 15 min"
          description: HTTP calls from WEBCON (REST actions and data sources) end with an error (timeout, connection refused, 4xx/5xx). Details - WEBCON – Operations dashboard, external API row.
          __dashboardUid__: webcon-operations
          __panelId__: "28"

      - uid: webcon-w10-log-errors
        title: W10 Spike in log errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: |-
                sum by (service_name) (count_over_time({service_name=~"Portal|WebCon.WorkFlow"} | detected_level=~"(?i)error|fatal|critical" [10m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [49] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service_name }}: {{ humanize $values.B.Value }} log errors in 10 min"
          description: At least 50 error/fatal records in 10 min. Logs - WEBCON – Performance dashboard, “Logs” row, or Explore (Loki).
          __dashboardUid__: webcon-performance
          __panelId__: "65"

      # Availability and database backlog (docs/projekt/projekt-dostepnosc-i-metryki-bazy.md)
      - uid: webcon-b1-probe-down
        title: B1 Portal unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (instance, probe) (probe_success{job="integrations/blackbox"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} unavailable ({{ $labels.probe }})"
          description: The HTTP probe has not received a 200 response (for the Portal - also the Healthy status from /health) for 3 min. HTTP code, response time and certificate - WEBCON – Availability and backlog dashboard. Code 401 for the Portal = WEBCON stopped answering /health for the Host localhost header (docs/installation/07-troubleshooting.md).
          __dashboardUid__: webcon-availability
          __panelId__: "2"

      - uid: webcon-b2-cert-expiry
        title: B2 Certificate expiring soon
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (instance) ((probe_ssl_earliest_cert_expiry{job="integrations/blackbox"} - time()) / 86400)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [14] } } ] }
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: certificate expires in {{ humanize $values.B.Value }} days (threshold 14)"
          description: The earliest-expiring certificate in the address TLS chain expires in less than 14 days - renew the IIS binding certificate.
          __dashboardUid__: webcon-availability
          __panelId__: "3"

      - uid: webcon-d1-timeouts-overdue
        title: D1 Overdue timeouts
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (database) (min_over_time(webcon_db_timeouts_overdue[30m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.database }}: at least {{ humanize $values.B.Value }} overdue timeouts for 30 min"
          description: Overdue instance timeouts have not dropped to zero for 30 min - the Service is not picking them up (stopped, “alive but dead” after a clock jump, overloaded). Check alert W4 and the “WEBCON WorkFlow Service” row of the WEBCON – Performance dashboard.
          __dashboardUid__: webcon-availability
          __panelId__: "11"

      - uid: webcon-d2-mails-failing
        title: D2 Failed emails increasing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # growth, not state: emails stay in WFMails after all attempts are used up (test server: 3782 after 5 attempts)
              expr: |-
                sum by (database) (webcon_db_mails{attempts!~"0|1|2"})
                - sum by (database) (webcon_db_mails{attempts!~"0|1|2"} offset 30m)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.database }}: +{{ humanize $values.B.Value }} emails with at least 3 failed attempts in 30 min"
          description: In the last 30 min the number of emails with at least 3 failed sending attempts (WFMails) has increased - check the SMTP configuration and the Service logs. Emails stay in the queue after all attempts are used up, so the alert tracks growth, not state.
          __dashboardUid__: webcon-availability
          __panelId__: "13"

      - uid: webcon-d3-recurrent-actions
        title: D3 Cyclical actions with errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (database) (min_over_time(webcon_db_recurrent_actions_overdue[30m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.database }}: {{ humanize $values.B.Value }} cyclical actions whose last run failed"
          description: Active cyclical actions whose last run ended with an error, for 30 min. Details - WEBCON Designer Studio (cyclical actions) and the Service logs.
          __dashboardUid__: webcon-availability
          __panelId__: "12"

  # -------------------------------------------------------------------
  - orgId: 1
    name: SQL Server and hosts
    folder: WEBCON – alerts
    interval: 1m
    rules:
      - uid: webcon-s1-deadlocks
        title: S1 SQL deadlocks
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (increase(mssql_deadlocks_total{job="integrations/mssql"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "SQL {{ $labels.instance }}: {{ humanize $values.B.Value }} deadlocks in 15 min"
          description: Deadlocks in SQL Server. Deadlock graph - system_health (Extended Events) on the SQL server.
          __dashboardUid__: sqlserver-webcon
          __panelId__: "19"

      - uid: webcon-s2-blocked-sessions
        title: S2 Long SQL blocking
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (instance) (mssql_blocked_sessions{job="integrations/mssql"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "SQL {{ $labels.instance }}: {{ humanize $values.B.Value }} blocked sessions for 10 min"
          description: Sessions continuously waiting on locks for 10 min. SQL Server – WEBCON dashboard, locks row; on the server, sys.dm_exec_requests (blocking_session_id).
          __dashboardUid__: sqlserver-webcon
          __panelId__: "17"

      - uid: webcon-s3-page-life
        title: S3 SQL memory pressure (Page Life Expectancy)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (instance) (mssql_page_life_expectancy_seconds{job="integrations/mssql"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [300] } } ] }
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "SQL {{ $labels.instance }}: Page Life Expectancy {{ humanize $values.B.Value }} s (threshold 300 s)"
          description: Pages have been leaving the buffer pool in under 5 min for 30 min - not enough memory for SQL Server or heavy scans (short drops during nightly maintenance - index rebuilds, DBCC, backups - are expected).
          __dashboardUid__: sqlserver-webcon
          __panelId__: "26"

      - uid: webcon-h1-cpu
        title: H1 High host CPU utilization
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[10m])))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [90] } } ] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: CPU {{ humanize $values.B.Value }}% (threshold 90%)"
          description: CPU utilization above 90% for 15 min. Processes - Windows – Host load dashboard, “Processes” row.
          __dashboardUid__: windows-host
          __panelId__: "9"

      - uid: webcon-h2-memory
        title: H2 Low host free memory
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (instance) (100 * (1 - windows_memory_available_bytes / windows_memory_physical_total_bytes))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [90] } } ] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: memory used {{ humanize $values.B.Value }}% (threshold 90%)"
          description: Used physical memory above 90% for 15 min. Processes - Windows – Host load dashboard.
          __dashboardUid__: windows-host
          __panelId__: "15"

      - uid: webcon-h3-disk-warning
        title: H3 Low disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (instance, volume) (100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [10] } } ] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.volume }}: {{ humanize $values.B.Value }}% free (threshold 10%)"
          description: Less than 10% free space on the volume.
          __dashboardUid__: windows-host
          __panelId__: "21"

      - uid: webcon-h4-disk-critical
        title: H4 Critically low disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (instance, volume) (100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [5] } } ] }
        noDataState: OK
        execErrState: Error
