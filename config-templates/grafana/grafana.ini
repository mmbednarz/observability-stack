; Grafana - configuration overriding conf/defaults.ini
; File generated by Install-ObservabilityStack.ps1.

[paths]
data = {{DATA_FWD}}/grafana
logs = {{LOGS_FWD}}/grafana
plugins = {{DATA_FWD}}/grafana/plugins
provisioning = {{CONFIG_FWD}}/grafana/provisioning

[server]
http_addr = {{GRAFANA_BIND}}
http_port = 3000

[security]
admin_user = admin
; Password used only when the Grafana database is first created
admin_password = $__file{{{SECRETS_FWD}}/grafana-admin.txt}
disable_gravatar = true
cookie_secure = false

[users]
allow_sign_up = false

[dashboards]
; Home dashboard: “Start” (dashboards/start.json) - description, links to dashboards and documentation
default_home_dashboard_path = {{CONFIG_FWD}}/grafana/dashboards/start.json

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[metrics]
enabled = true

[log]
mode = file
level = info
