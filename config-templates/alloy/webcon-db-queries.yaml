# Metrics from the WEBCON content database (backlog and queues) - query_config of the second prometheus.exporter.mssql instance
# ("webcon_data", job integrations/mssql-webcon). File generated by Install-ObservabilityStack.ps1 /
# Install-ObservabilityAgent.ps1 from config-templates/alloy/webcon-db-queries.yaml.
# Database: {{WEBCON_CONTENT_DB}} (three-part object names - the exporter connects to master).
# Permissions: a database user for the exporter login in the content database + SELECT only on the columns used in the queries
# (sql/grant-webcon-db-metrics.sql). Counting with COUNT(<column>) - COUNT(*) would require SELECT on the whole table.
# Design: docs/projekt/projekt-dostepnosc-i-metryki-bazy.md
collector_name: webcon_db

metrics:
  # Row counts of queue tables, log tables and WFElements - from metadata (no table scans, no data permissions)
  - metric_name: webcon_db_table_rows
    type: gauge
    help: 'Row count of queue (%QUEUE%), log (%LOGS%) and WFElements tables in the WEBCON content database (sys.partitions; excluding additional ZWEBCON_* tables).'
    key_labels:
      - database
      - table
      - kind
    values: [row_count]
    query: |
      SELECT N'{{WEBCON_CONTENT_DB}}' AS [database],
             t.name AS [table],
             CASE WHEN t.name LIKE N'%QUEUE%' THEN N'queue'
                  WHEN t.name = N'WFElements' THEN N'elements'
                  ELSE N'log' END AS kind,
             CAST(SUM(p.rows) AS bigint) AS row_count
      FROM [{{WEBCON_CONTENT_DB}}].sys.partitions AS p
      JOIN [{{WEBCON_CONTENT_DB}}].sys.tables AS t ON t.object_id = p.object_id
      WHERE p.index_id IN (0, 1)
        AND (t.name LIKE N'%QUEUE%' OR t.name LIKE N'%LOGS%' OR t.name = N'WFElements')
        -- additional tables outside the WEBCON schema (e.g. ZWEBCON_SupportQueue on the test server)
        AND t.name NOT LIKE N'ZWEBCON[_]%'
        -- log source dictionary, not a log table (the name contains "LogS")
        AND t.name <> N'DicLogSources'
        -- configuration database logs - empty in the content database (WEBCON writes them to the configuration database)
        AND t.name NOT IN (N'AdminWFEventLogs', N'AdminServiceLogs')
      GROUP BY t.name

  # Email queue by send attempt count (0-5 always present; higher values if they occur)
  - metric_name: webcon_db_mails
    type: gauge
    help: 'Number of emails in the WFMails queue by send attempt count (MAIL_AttemptsNumber).'
    key_labels:
      - database
      - attempts
    values: [mails]
    query: |
      WITH n AS (SELECT v FROM (VALUES (0), (1), (2), (3), (4), (5)) AS x(v)),
           m AS (SELECT MAIL_AttemptsNumber AS a, COUNT(MAIL_AttemptsNumber) AS c
                 FROM [{{WEBCON_CONTENT_DB}}].dbo.WFMails
                 GROUP BY MAIL_AttemptsNumber)
      SELECT N'{{WEBCON_CONTENT_DB}}' AS [database],
             CAST(COALESCE(m.a, n.v) AS nvarchar(10)) AS attempts,
             ISNULL(m.c, 0) AS mails
      FROM n FULL OUTER JOIN m ON m.a = n.v

  # Cyclical actions whose last execution failed (same condition as in the RECURRENTACTIONS collector)
  - metric_name: webcon_db_recurrent_actions_overdue
    type: gauge
    help: 'Active cyclical actions whose last execution failed, not assigned to a Service (WFRecurrentActionsStats).'
    key_labels:
      - database
    values: [actions]
    query: |
      SELECT N'{{WEBCON_CONTENT_DB}}' AS [database], COUNT(RAS_NextLaunch) AS actions
      FROM [{{WEBCON_CONTENT_DB}}].dbo.WFRecurrentActionsStats
      WHERE (RAS_TimeLastFailure > RAS_TimeLastSuccess OR (RAS_TimeLastFailure IS NOT NULL AND RAS_TimeLastSuccess IS NULL))
        AND RAS_ServiceName IS NULL
        AND RAS_Status = 0
        AND RAS_NextLaunch IS NOT NULL

  # Overdue timeouts not picked up by the Service (same condition as in the TIMEOUTACTIONS collector)
  - metric_name: webcon_db_timeouts_overdue
    type: gauge
    help: 'Overdue instance timeouts awaiting execution, not assigned to a Service (WFElementTimeouts).'
    key_labels:
      - database
    values: [timeouts]
    query: |
      SELECT N'{{WEBCON_CONTENT_DB}}' AS [database], COUNT(e.ETM_TIMID) AS timeouts
      FROM [{{WEBCON_CONTENT_DB}}].dbo.WFElementTimeouts AS e
      JOIN [{{WEBCON_CONTENT_DB}}].dbo.WFTimeouts AS t ON t.TIM_ID = e.ETM_TIMID
      JOIN [{{WEBCON_CONTENT_DB}}].dbo.WFSteps AS s ON s.STP_ID = t.TIM_STPID
      JOIN [{{WEBCON_CONTENT_DB}}].dbo.WorkFlows AS w ON w.WF_ID = s.STP_WFID
      JOIN [{{WEBCON_CONTENT_DB}}].dbo.WFDefinitions AS d ON d.DEF_ID = w.WF_WFDEFID AND d.DEF_EnableTimeouts = 1
      WHERE e.ETM_ServiceName IS NULL
        AND e.ETM_Status = 0
        AND t.TIM_IsNightOnly = 0
        AND e.ETM_ExpireTime < GETDATE()
        AND e.ETM_OccurrenceErrorsCount < 10
        AND (t.TIM_RepeatCount = 0 OR t.TIM_RepeatCount > e.ETM_OccurrenceCount)
        AND (e.ETM_LastAttemptTime IS NULL
             OR (e.ETM_AttemptsNumber <= 0 AND GETDATE() > DATEADD(second, 3600, e.ETM_LastAttemptTime)))
