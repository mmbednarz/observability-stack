# Grafana Loki 3.x - single binary, filesystem storage.
# File generated by Install-ObservabilityStack.ps1.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: {{DATA_FWD}}/loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: {{DATA_FWD}}/loki/chunks
      rules_directory: {{DATA_FWD}}/loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: {{RETENTION_LOGS}}
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: {{DATA_FWD}}/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
